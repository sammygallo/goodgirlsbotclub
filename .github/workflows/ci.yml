# Runs the vitest suite on every PR and on pushes to main. Lint is NOT run
# here — the tree has pre-existing eslint errors; wire `npm run lint` in once
# those are cleaned up.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # node_modules is committed for local-dev convenience but was installed
      # on macOS; reinstall for linux, same as the Dockerfile build stage.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
