# Local development overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Pairs with `npm run dev` (vite at http://localhost:3000 proxying to
# ggbc-backend on :8001 via vite.config.ts).
#
# What this overlay does:
#   - Publishes ggbc-backend + postgres to host loopback (they share
#     frontend's network namespace, so we add the host port mappings
#     to the frontend service).
#   - Builds ggbc-backend from a local checkout (prod uses GHCR).
#   - Switches cookies to non-Secure so they work on HTTP localhost.
#   - Allows self-registration so you can spin up users without an invite.
#
# Production unchanged — that's just `docker compose up -d` against
# docker-compose.yml alone.

services:
  frontend:
    # Frontend image is currently amd64-only on GHCR. Docker Desktop on
    # Apple Silicon emulates amd64 via Rosetta — slower but functional.
    platform: linux/amd64
    # Replace (not merge) the ports list — port 80 is skipped in dev
    # because vite serves the frontend on :3000 and port 80 is often
    # in use on developer machines. Publishing the backing service
    # ports here works because they share the frontend's network namespace.
    ports: !override
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:5432:5432"

  ggbc-backend:
    # Build locally instead of pulling the GHCR image — the prod image is
    # currently amd64-only and won't run on Apple Silicon. Assumes the
    # ggbc-backend repo is checked out at ../ggbc-backend relative to this
    # repo's root. Override via GGBC_BACKEND_PATH if it lives elsewhere.
    build:
      context: ${GGBC_BACKEND_PATH:-../ggbc-backend}
    environment:
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=lax
      - ALLOW_SELF_REGISTRATION=true
      - ENVIRONMENT=development
      - OWNER_HANDLE=${OWNER_HANDLE}
      - OWNER_PASSWORD=${OWNER_PASSWORD}
    command:
      - "sh"
      - "-c"
      - "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
