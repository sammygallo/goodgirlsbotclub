server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static frontend — fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All dynamic traffic goes to ggbc-backend on :8001. B3c-final removed
    # SillyTavern entirely, so there's only one upstream now. The shared
    # network namespace means localhost:8001 reaches the ggbc-backend
    # container directly.
    #
    # X-Forwarded-For is pinned to 127.0.0.1 for legacy compatibility with
    # any internal whitelist checks.

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support for message generation
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /invitations {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sync/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No trailing slash on the location so GET /blobs (the list endpoint)
    # matches without nginx auto-redirecting to /blobs/. The outer TLS
    # terminator is upstream of this nginx, so the auto-add-slash redirect
    # came out as http:// and got blocked as mixed-content by the browser.
    location /blobs {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Persona avatars + VN backgrounds can be a few MB; live-portrait
        # MP4s can be ~5 MB.
        client_max_body_size 20M;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
    }

    location /characters {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
    }

    location /chats {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
    }

    # Upstream-compat shim modules — these MUST take precedence over the
    # generic /scripts/ proxy below. They shadow the canonical upstream
    # filenames so ES-module-based extensions can `import { ... } from
    # '../../../extensions.js'` and resolve to the mobile-fork shim
    # instead of dragging in upstream SillyTavern's monolithic frontend.
    # `location =` is an exact-match rule and beats prefix matches.
    location = /scripts/extensions.js {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
    }
    location = /scripts/slash-commands.js {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
    }
    location = /scripts/utils.js {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
    }
    # /script.js (singular) is at the root, not under /scripts/, so it
    # already falls through to static + the SPA fallback. The exact-match
    # rule below disables the SPA fallback so the public/script.js shim is
    # actually served instead of getting rewritten to index.html.
    location = /script.js {
        try_files $uri =404;
        types { application/javascript js; }
        default_type application/javascript;
    }

    # Third-party extension files (Extension-Live2d, etc) are now served
    # natively by ggbc-backend out of user_blobs. Routes match
    # /scripts/extensions/third-party/{ext}/{path}; everything else under
    # /scripts/ still falls back to the static frontend bundle (the shim
    # modules above) via try_files.
    location /scripts/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For 127.0.0.1;
    }

    # Allow uploads up to 20 MB (avatars, sprites, attachments)
    client_max_body_size 20M;

    # Cookies + auth headers can grow past nginx's 8 KB default after a few
    # sessions, producing 400 "Request Header Or Cookie Too Large".
    large_client_header_buffers 8 32k;
    client_header_buffer_size 16k;
}
