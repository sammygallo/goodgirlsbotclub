services:
  frontend:
    # Pre-built by .github/workflows/docker-publish.yml on every push to main.
    # The droplet pulls this image instead of running the 10-minute Vite build
    # on its single vCPU. If you need a local image for dev, uncomment `build: .`
    # below — docker compose will prefer a registry pull unless you run
    # `docker compose build` explicitly.
    image: ghcr.io/sammygallo/goodgirlsbotclub:latest
    # build: .
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped

  postgres:
    # All four backing services share frontend's network namespace so they
    # reach each other on 127.0.0.1 — postgres is on :5432, ST on :8000,
    # ggbc-backend on :8001. This is the same pattern that already lets
    # nginx talk to ST directly on localhost; ggbc-backend slots in alongside.
    image: postgres:16-alpine
    network_mode: "service:frontend"
    environment:
      - POSTGRES_USER=ggbc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ggbc}
      - POSTGRES_DB=ggbc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggbc -d ggbc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ggbc-backend:
    # Built and published by sammygallo/ggbc-backend's .github/workflows/
    # docker-publish.yml. Same pattern as the frontend — droplet pulls,
    # never builds.
    image: ghcr.io/sammygallo/ggbc-backend:latest
    network_mode: "service:frontend"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ggbc:${POSTGRES_PASSWORD:-ggbc}@127.0.0.1:5432/ggbc
      - ST_BASE_URL=http://127.0.0.1:8000
      # ggbc-backend uses the owner account as its ST service identity —
      # one credential set, configured via .env on the droplet.
      - ST_SERVICE_HANDLE=${OWNER_HANDLE:-}
      - ST_SERVICE_PASSWORD=${OWNER_PASSWORD:-}
      - OWNER_HANDLE=${OWNER_HANDLE:-}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=lax
      - ALLOW_SELF_REGISTRATION=${ALLOW_SELF_REGISTRATION:-false}
      - ENVIRONMENT=production
    # Run pending migrations, then start uvicorn. Migrations are idempotent
    # so this is safe on every container start.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8001"]
    depends_on:
      postgres:
        condition: service_healthy
      sillytavern:
        condition: service_started
    restart: unless-stopped

  sillytavern:
    image: ghcr.io/sammygallo/sillytavern:feat-role-based-permissions
    entrypoint: ["/bin/sh", "/st-init.sh"]
    # Share frontend's network namespace: nginx connects to localhost:8000,
    # so ST always sees 127.0.0.1 — permanently whitelisted, no tricks needed.
    # Docker Compose infers the startup dependency automatically.
    network_mode: "service:frontend"
    environment:
      - ST_PORT=8000
    volumes:
      - ./docker/st-init.sh:/st-init.sh:ro
      - st-config:/home/node/app/config
      - st-data:/home/node/app/data
    restart: unless-stopped

  seed-owner:
    image: alpine:latest
    # frontend's namespace = ST's namespace (ST uses service:frontend)
    network_mode: "service:frontend"
    volumes:
      - ./docker/seed-owner.sh:/seed-owner.sh:ro
      - st-config:/config
    environment:
      - OWNER_HANDLE=${OWNER_HANDLE:-}
      - OWNER_PASSWORD=${OWNER_PASSWORD:-}
      - OWNER_NAME=${OWNER_NAME:-}
      - ST_PORT=8000
    entrypoint: ["/bin/sh", "/seed-owner.sh"]
    depends_on:
      sillytavern:
        condition: service_started
    restart: "no"

volumes:
  st-config:
  st-data:
  pgdata:
