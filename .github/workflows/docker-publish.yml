# Builds and publishes the frontend Docker image to GHCR so the droplet can
# just pull a pre-built image instead of running the 10-minute Vite build on
# a 1-vCPU box. Runs on every push to main and on manual dispatch.

name: Publish Frontend Docker Image

on:
  push:
    branches:
      - main
    # Skip the image rebuild for changes that cannot reach the bundle.
    #
    # DELIBERATELY an explicit allow-list, NOT `docs/**` or `**.md`:
    # four docs are compiled INTO the app via Vite `?raw` imports —
    #   docs/faq.md             -> src/components/help/HelpChat.tsx
    #   docs/character-guide.md  \
    #   docs/hypercode-guide.md   > src/components/guides/guides.ts
    #   docs/lorebook-guide.md   /
    # so a blanket docs ignore would silently ship a stale FAQ or guide
    # with no failure anywhere to notice it.
    #
    # Anything NOT listed here still triggers a build. That is the point:
    # a new doc added later is wasteful-but-safe by default, and only
    # becomes skippable when someone deliberately adds it below after
    # confirming nothing imports it. Fail toward rebuilding.
    #
    # `*.md` matches root level only — GitHub's glob `*` does not cross
    # `/` — so it covers README/ROADMAP without touching docs/faq.md.
    paths-ignore:
      - '*.md'
      - 'docs/story-state-*.md'
      - 'docs/pgvector-migration-plan.md'
      - 'docs/v2/**'
      - '.gitignore'
      # The database image and its own workflow. Nothing here can reach the
      # Vite bundle (no `?raw` import can pull in a Dockerfile), and it has
      # a dedicated publish workflow of its own.
      - 'docker/postgres/**'
      - '.github/workflows/docker-publish-postgres.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Repo name lowercased at runtime (GHCR requires lowercase)
  REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${REPO,,}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
