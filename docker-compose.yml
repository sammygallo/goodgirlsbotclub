services:
  frontend:
    # Pre-built by .github/workflows/docker-publish.yml on every push to main.
    # The droplet pulls this image instead of running the 10-minute Vite build
    # on its single vCPU. If you need a local image for dev, uncomment `build: .`
    # below — docker compose will prefer a registry pull unless you run
    # `docker compose build` explicitly.
    image: ghcr.io/sammygallo/goodgirlsbotclub:latest
    # build: .
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped

  postgres:
    # postgres + ggbc-backend share frontend's network namespace so they
    # reach each other on 127.0.0.1 — postgres is on :5432, ggbc-backend
    # on :8001. nginx (running inside the frontend container) talks to
    # ggbc-backend directly on localhost.
    image: postgres:16-alpine
    network_mode: "service:frontend"
    environment:
      - POSTGRES_USER=ggbc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ggbc}
      - POSTGRES_DB=ggbc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggbc -d ggbc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ggbc-backend:
    # Built and published by sammygallo/ggbc-backend's .github/workflows/
    # docker-publish.yml. Same pattern as the frontend — droplet pulls,
    # never builds.
    #
    # B3c-final — SillyTavern is gone. ggbc-backend owns auth, characters,
    # chats, generation (multi-provider), secrets, settings, user admin,
    # permissions, live-portrait generation, and extension serving.
    image: ghcr.io/sammygallo/ggbc-backend:latest
    network_mode: "service:frontend"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ggbc:${POSTGRES_PASSWORD:-ggbc}@127.0.0.1:5432/ggbc
      - OWNER_HANDLE=${OWNER_HANDLE}
      - OWNER_PASSWORD=${OWNER_PASSWORD}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=lax
      - ALLOW_SELF_REGISTRATION=${ALLOW_SELF_REGISTRATION:-false}
      - ENVIRONMENT=production
      # Fernet master key for at-rest encryption of API secrets. MUST be
      # set in .env on the droplet (generate with `python -c "from
      # cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`).
      # If unset, ggbc-backend falls back to a public dev key — anyone
      # with the source can decrypt the DB.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
    # Run pending migrations, then start uvicorn. Migrations are idempotent
    # so this is safe on every container start.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8001"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
